spring.mvc.view.prefix: /WEB-INF/views/
spring.mvc.view.suffix: .jsp

# Spring security debug
logging.level.org.springframework.security=DEBUG
#SQL logs
logging.level.org.hibernate.SQL=DEBUG

spring.jpa.show-sql=true

# PostgreSQL config. Credentials come from the environment, never from this file:
#   AURORA_DB_URL       (default jdbc:postgresql://localhost:5432/aurora)
#   AURORA_DB_USERNAME  (default aurora)
#   AURORA_DB_PASSWORD  (required)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${AURORA_DB_URL:jdbc:postgresql://localhost:5432/aurora}
spring.datasource.username=${AURORA_DB_USERNAME:aurora}
spring.datasource.password=${AURORA_DB_PASSWORD}

# Flyway applies src/main/resources/db/migration on startup; Hibernate must not alter the schema.
# A database created by the migration runbook (psql + V1) is recorded as version 1, not re-created.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
#END
